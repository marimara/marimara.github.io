about:
  - Mariana is a game developer focused on gameplay programming, Unity development and interactive systems. She has experience working across programming, level design, technical art, 3D production and project management, giving her a broad understanding of the game development pipeline.
  - She enjoys building systems that are clear, reusable and easy to iterate on, with special interest in gameplay mechanics, UI/gameplay integration, level-building workflows and data-driven tools.
  - She has worked on commercial, cultural and educational projects, including a game released on Steam and interactive projects developed in partnership with institutions such as the Federal University of Minas Gerais. Her multidisciplinary background helps her communicate easily with programmers, artists and designers throughout production.

