- slug: reliquias-de-minas
  title: Relíquias de Minas
  filter: Games
  category: 3D Platformer / Cultural Game
  status: Released
  period: "2025"
  context: Cultural grant from the State of Minas Gerais, Brazil
  role: Gameplay Programmer / Level Designer / Technical Art
  engine: Unity
  language: C#
  cover: "/assets/media/projects/Relíquias de Minas/Cover.png"
  cover_alt: Relíquias de Minas platforming scene
  links:
    - { label: Itch.io, url: "https://meganeura-games.itch.io/reliquias-de-minas", icon: "fab fa-itch-io" }
    - { label: GitHub, url: "https://github.com/meganeura-games/Relics", icon: "fab fa-github" }
  featured: true
  summary: A 3D platformer developed for a cultural project from the State of Minas Gerais, combining exploration, platforming challenges and regional themes.
  description: I was responsible for the game's gameplay programming and full level design, with the exception of HUD programming. My work included player movement and platforming feel, enemies, collectibles, hazards, platforms, progression, Cinemachine camera behavior, reusable level-building assets and Shader Graph effects.
  contributions:
    - title: Gameplay Programming & Platformer Feel
      intro: Responsive character movement, double jump, tuned acceleration and gravity, knockback, damage, collectibles, enemies and interactive platforming elements.
      bullets:
        - Programmed the core gameplay systems outside the HUD.
        - Tuned separate ground and air acceleration and rising and falling gravity.
        - Implemented double jump, ground detection, knockback and speed control.
        - Built moving, falling and one-way platforms, kill zones and collectibles.
        - Implemented enemy patrol, contact and ranged damage, weak spots and projectiles.
        - Implemented health, temporary invulnerability and shield gameplay.
    - title: Cinemachine Camera
      intro: Camera behavior designed for platforming readability, including contextual framing during vertical movement and long falls.
      bullets:
        - Configured Cinemachine cameras for platforming readability and comfort.
        - Implemented priority switching between normal and fall-focused cameras using vertical velocity, a threshold and a delay.
    - title: Level Design & Level-Building Workflow
      intro: Complete level design and a reusable asset workflow intended to make construction and iteration faster.
      bullets:
        - Designed all gameplay levels, traversal flow, platform placement, encounters and collectibles.
        - Built reusable and configurable gameplay assets for faster level assembly and iteration.
        - Balanced traversal pacing and challenge around the movement and camera systems.
    - title: Progression & Save Systems
      intro: Persistent level progression with locked, unlocked and completed states and collected-coin tracking.
      bullets:
        - Implemented completion and progression logic.
        - Saved and loaded completion data using serialized JSON files.
        - Automatically unlocked subsequent levels after completion.
    - title: Shader Graph / Technical Art
      intro: Custom stylized character rendering, an outline effect and a transparent shield bubble effect.
      bullets:
        - Character Toon Shader combining the main texture, tinting and a Fresnel contribution.
        - Vertex-expanded Outline Shader with configurable thickness and color.
        - Transparent Lit Shield Bubble Shader using Fresnel-driven edge, emission and alpha behavior.
  technologies: [Unity, C#, Cinemachine, Shader Graph, Unity Input System, ScriptableObjects / DeTach Variables, Odin Inspector]
  media:
    - { type: video, src: "/assets/media/projects/Relíquias de Minas/platformer game-feel video.mp4", label: "Platformer Game Feel — movement, camera and level systems" }
    - { type: video, src: "/assets/media/projects/Relíquias de Minas/Shield and Toon Shader.mp4", label: "Shader Graph — shield and toon shader" }

