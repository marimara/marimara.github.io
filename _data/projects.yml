- slug: bacia-hidrografica-virtual
  title: Bacia Hidrográfica Virtual
  filter: Programming
  category: Educational Game / Interactive Platform
  status: In Development
  period: 2025 - Present
  context: Federal University of Minas Gerais
  role: Game Programmer
  engine: Unity
  language: C#
  platforms: [Web]
  cover: /assets/media/projects/BaciaHidrograficaVirtual/Cover.png
  cover_alt: Bacia Hidrográfica Virtual interactive basin map
  featured: true
  summary: Educational platform developed in Unity that combines interactive hydrographic basin maps with minigames focused on land use, sanitation and flood management.
  description: "My work includes both basin navigation and visualization systems and the development of three minigames: Maps, Poop and Flood. My contributions include hex-grid systems, tile placement, configurable scoring rules, river connectivity, flow through pipe networks and a flood simulation based on per-cell map data."
  contributions:
    - title: Hex-Based Strategy & Level Tools
      intro: Custom hex-grid gameplay system with data-driven level creation and automatic tile connectivity.
      bullets:
        - Hexagonal grid, neighbor detection & tile placement
        - Custom in-editor map painting tool
        - Event-driven updates for basin title, description and destination scene.
        - Automatic river connection & rotation system
      media:
        - { type: video, src: "/assets/media/projects/BaciaHidrograficaVirtual/Basin.mp4", label: "Hex-Based Strategy & Level Tools" }
    - title: Data-Driven Gameplay & Scoring System
      intro: Modular strategy system where tile placement, neighboring pieces and configurable rules dynamically affect gameplay.
      bullets:
        - ScriptableObject-based modular scoring rules
        - Hex-neighbor interactions with contextual bonuses & penalties
        - Dynamic score recalculation when neighboring tiles change
        - Deck-based tile placement with real-time preview & 60° rotation
        - Automatic game time river connection validation
      media:
        - { type: video, src: "/assets/media/projects/BaciaHidrograficaVirtual/Maps minigame video loop.mp4", label: "Data-Driven Gameplay & Scoring System" }
    - title: Dynamic Water Flow & Pipe Network
      intro: Real-time pipe connectivity and animated water-flow system built around Unity's LineRenderer.
      bullets:
        - Procedural pipe connection and path traversal
        - Dynamic LineRenderer path generation and animated flow propagation
        - Incremental path rebuilding when the pipe network changes
        - Flow-driven gameplay events including leaks, buffs, debuffs and checkpoints
      media:
        - { type: video, src: "/assets/media/projects/BaciaHidrograficaVirtual/Poop minigame video loop.mp4", label: "Dynamic Water Flow & Pipe Network" }
    - title: Flood Simulation & Dynamic Water System
      intro: Custom hex-grid flood simulation driven by rainfall, terrain elevation and per-tile water absorption.
      bullets:
        - Terrain-aware flood simulation across interconnected hex cells
        - Per-tile rainfall, absorption and flood-depth calculations
        - Neighbor-aware water rendering for continuous flood surfaces
        - Custom level editor for painting terrain type and elevation
        - Data-driven rain intensity, flood thresholds and level parameters
      media:
        - { type: video, src: "/assets/media/projects/BaciaHidrograficaVirtual/Flood minigame video loop.mp4", label: "Flood Simulation & Dynamic Water System" }
  technologies: [Unity, C#, ScriptableObjects, Unity Input System, UnityEvents / Event-Driven Architecture, DeTach, DOTween, Odin Inspector]
