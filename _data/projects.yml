- slug: reigns
  title: Reigns
  filter: Programming
  category: Narrative Systems / Mission Management Prototype
  status: Prototype / Study Project
  period: "2026"
  role: Game Programmer
  engine: Unity
  language: C#
  cover: /assets/media/projects/Reigns/Cover.png
  cover_alt: Reigns narrative management prototype
  links:
    - { label: GitHub, url: "https://github.com/marimara/Reigns", icon: "fab fa-github" }
  summary: A narrative-management prototype inspired by Dispatch, studying how a systemic visual novel can combine dialogue, characters, missions, conditions and progression.
  description: This prototype was primarily a technical study using Pixel Crushers Dialogue System for Unity. I explored how narrative content could connect to character stats, unlock conditions, mission assignments, day progression and story events instead of treating dialogue as an isolated system.
  contributions:
    - title: Narrative-Driven Progression & Mission Systems
      intro: Data-driven prototype combining conditional story events, character progression and mission resolution.
      bullets:
        - ScriptableObject-based story events filtered by location, day, quest state and priority
        - Mission success calculated from individual or combined character stats
        - Temporary conditions that modify character stats across multiple in-game days
        - Event-driven unlocks tied to time progression, completed missions and dialogue quest states
      media:
        - { type: video, src: "/assets/media/projects/Reigns/Gravação de Tela 2026-08-27 164336.mp4", label: "Narrative-Driven Progression" }
        - { type: video, src: "/assets/media/projects/Reigns/Gravação de Tela 2026-08-27 164913.mp4", label: "Mission Systems" }
  technologies: [Unity, C#, Pixel Crushers Dialogue System, ScriptableObjects, Odin Inspector, DOTween, Event-Driven Gameplay Logic]

