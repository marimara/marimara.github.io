  summary: A narrative-management prototype inspired by Dispatch, studying how a systemic visual novel can combine dialogue, characters, missions, conditions and progression.
  description: This prototype was primarily a technical study using Pixel Crushers Dialogue System for Unity. I explored how narrative content could connect to character stats, unlock conditions, mission assignments, day progression and story events instead of treating dialogue as an isolated system.
  contributions:
    - title: Narrative & Event Integration
      intro: Story events connected to location, day and quest-state requirements through the Dialogue System.
      bullets:
        - Integrated Pixel Crushers Dialogue System into the project structure.
        - Created configurable story events linked to locations and conversations.
        - Added day, quest-state and one-time playback conditions.
        - Synchronized current-day and other gameplay variables with dialogue variables.
    - title: Character & Progression Systems
      intro: Data-driven characters with stats, temporary conditions and multiple unlock methods.
      bullets:
        - Created ScriptableObject-based character data with seven attributes.
        - Implemented unlocking through starting state, day, completed missions or quest state.
        - Created temporary conditions that modify stats for a limited number of days.
    - title: Mission Management Prototype
      intro: Configurable missions, character assignment and success calculations based on individual and team stats.
      bullets:
        - Created mission requirements, duration, rewards, dependencies and repeatability settings.
        - Implemented availability based on day and completed missions.
        - Calculated individual and team success chances against requirements.
        - Added active and completed states, rewards and outcome conditions.
  technologies: [Unity, C#, Pixel Crushers Dialogue System, ScriptableObjects, Odin Inspector, DOTween, Event-Driven Gameplay Logic]
  media:
    - { type: image, src: "/assets/media/projects/Reigns/InGameImage.png", alt: "Reigns narrative and mission management interface", label: "Narrative and mission-management systems" }

